name: CI

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "26.x"
      # The pnpm version comes from the packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - name: CI
        run: |
          pnpm install --frozen-lockfile
          pnpm run compile
          pnpm run lint
          pnpm run stylelint
          pnpm run build --no-stats
          pnpm run test
        env:
          DATABASE_CLIENT: sqlite
          NODE_COMPILE_CACHE: /tmp/node-compile-cache

  docker:
    # Publish only what passed CI, and only the fork's branch and release tags.
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/bopomofo' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      # A path context, so that .dockerignore applies.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
